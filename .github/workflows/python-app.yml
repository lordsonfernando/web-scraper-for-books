# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main","feature/1" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

          # Step 1: Authenticate to Google Cloud using Workload Identity Federation (OIDC)
      - name: Authenticate to Google Cloud
        # This action fetches an OIDC token from GitHub and exchanges it for
        # Google Cloud credentials (short-lived access tokens).
        # It then sets up gcloud CLI to use these credentials.
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          # The Workload Identity Provider ID you set up in GCP.
          # It includes your GCP project number, pool name, and provider name.
          workload_identity_provider: 'projects/${{ env.PROJECT_ID}}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          # The service account email that the GitHub Actions runner will assume.
          # This service account must have the necessary permissions to
          # interact with Artifact Registry.
          service_account: 'github-actions-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com'

      # Step 2: Configure Docker to use the authenticated Google Cloud credentials
      - name: Set up Docker for Google Artifact Registry
        # This command configures Docker's credential helper to use `gcloud`
        # for authentication when pushing or pulling images from the specified
        # Artifact Registry location.
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      # From here, your Docker build and push commands will automatically
      # authenticate using the configured gcloud credentials.
      - name: Build Docker image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push Docker image to Google Artifact Registry
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
Explanation of Key Elements:
permissions: id-token: 'write': This is a crucial permission for the GitHub Actions job. It allows the workflow to request an OIDC token from GitHub. This token is then presented to Google Cloud for authentication.
google-github-actions/auth@v2 action:
This is a pre-built GitHub Action provided by Google.
It takes your project_id, workload_identity_provider, and service_account as inputs.
Internally, it handles the exchange of the GitHub OIDC token for short-lived Google Cloud credentials and configures the gcloud CLI environment on the runner with these credentials.
gcloud auth configure-docker <location>-docker.pkg.dev command:
This command configures Docker's credential helper. It tells Docker that whenever it needs to authenticate with an Artifact Registry host (e.g., asia-south1-docker.pkg.dev), it should use the gcloud CLI to get the necessary authentication tokens.
Since google-github-actions/auth@v2 has already set up gcloud with valid credentials, Docker can now seamlessly authenticate.
Required Google Cloud IAM Permissions for the Service Account:
The service_account you use in the google-github-actions/auth@v2 step must have the following IAM roles in your Google Cloud Project:

roles/artifactregistry.writer: This allows the service account to push and pull Docker images to/from your Artifact Registry repository.
roles/iam.workloadIdentityUser: This role is granted on the service account itself, specifying which workload identity pool principal (your GitHub repository in this case) is allowed to impersonate this service account.
By following these steps, your GitHub Actions workflow will be able to securely authenticate to Google Cloud and push your Docker images to Artifact Registry.






