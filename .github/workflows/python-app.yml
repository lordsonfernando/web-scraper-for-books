# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information  see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main","feature/1" ]
  pull_request:
    branches: [ "main" ]
env: 
  PROJECT_ID: 'causal-galaxy-459115-v0'
  GAR_LOCATION: 'asia-south1'
  REPOSITORY: 'python-web-scraper'
  IMAGE_NAME: 'web-scraper'
permissions:
  contents: read
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

          # Step 1: Authenticate to Google Cloud using Workload Identity Federation (OIDC)
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        project_id: 'causal-galaxy-459115-v0'
        workload_identity_provider: 'projects/263386665758/locations/global/workloadIdentityPools/github-pool-test/providers/github-provider'
        service_account: 'github-actions-sa@causal-galaxy-459115-v0.iam.gserviceaccount.com'

      # Step 2: Configure Docker to use the authenticated Google Cloud credentials
    - name: Set up Docker for Google Artifact Registry
      # This command configures Docker's credential helper to use `gcloud`
      # for authentication when pushing or pulling images from the specified
      # Artifact Registry location.
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev
        gcloud auth list 
        gcloud info
        

    # From here, your Docker build and push commands will automatically
      # authenticate using the configured gcloud credentials.
    - name: Build Docker image
      run: |
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest .
    
    - name: Push Docker image to Google Artifact Registry
      run: |
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

# This command configures Docker's credential helper. It tells Docker that whenever it needs to authenticate with an Artifact Registry host (e.g., asia-south1-docker.pkg.dev), it should use the gcloud CLI to get the necessary authentication tokens.
# Since google-github-actions/auth@v2 has already set up gcloud with valid credentials, Docker can now seamlessly authenticate.
